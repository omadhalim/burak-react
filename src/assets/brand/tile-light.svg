<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="160" height="160" viewBox="0 0 160 160">
  <defs>
    <path id="petal" d="M0 -44 C 11 -35 11 -19 0 -11 C -11 -19 -11 -35 0 -44 Z"/>
    <path id="leaf" d="M0 0 C 9 8 9 20 0 27 C -9 20 -9 8 0 0 Z"/>
    <g id="lobes">
